log_level: debug

llm:
  base_url: "https://api.openai.com/v1"
  model: "gpt-4o"
  api_key: ""
  temperature: 1.0
  top_p: 0.95
  top_k: 0
  context_window: 128000
  vision: false
  skip_on_tool_dispatch_error: false
  # extra_body:
  #   chat_template_kwargs:
  #     enable_thinking: true
  #   presence_penalty: 0

models:
  Qwen3-32B:
    temperature: 0.6
    context_window: 131072
    vision: true
    extra_body:
      chat_template_kwargs:
        enable_thinking: true
  Qwen3-8B:
    temperature: 0.3
    top_p: 0.9
    context_window: 131072
  deepseek-r1:
    temperature: 0.7
    context_window: 65536
    extra_body:
      chat_template_kwargs:
        thinking: true
        reasoning_effort: high

container:
  enabled: false
  name: ""
  runtime: ""

tool:
  max_output_chars: 100000
  web_search_api: ""
  fetch_proxy: ""

browser:
  enabled: false
  listen_addr: "127.0.0.1:8020"
  path: "/browser"
  bearer_token: ""
  request_timeout_seconds: 30

workspace:
  cwd: "./workspace"
  skills_dir: "./.skills"
  crons_dir: "./.cron"
  session_dir: "./.session"

context:
  max_image_bytes: 5242880
  max_output_tokens: 16384
  compression_threshold: 0.7

feishu:
  app_id: ""
  app_secret: ""
  encrypt_key: ""
  verification_token: ""

wechat:
  enabled: false
  # bot_token: ""   # optional: if set, skip QR login on startup
  # base_url: ""    # optional: override https://ilinkai.weixin.qq.com

webui:
  enabled: true
  host: "127.0.0.1"
  port: 8017
  token: ""
  index_html_path: "../chat.html"

heartbeat:
  interval_seconds: 1800

sessions:
  "oc_abc123def456":
    llm:
      model: "gpt-4o-mini"
      temperature: 0.3

    context:
      max_output_tokens: 8192

