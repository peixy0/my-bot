log_level: debug

llm:
  base_url: "https://api.openai.com/v1"
  model: "gpt-4o"
  api_key: ""
  temperature: 1.0
  context_window: 128000
  vision: false
  skip_on_tool_dispatch_error: false
  extra_body:
    chat_template_kwargs:
      enable_thinking: true
    presence_penalty: 0

presets:
  default-completion:
    model: "gpt-4o"
    temperature: 1.0
    context_window: 128000
    vision: false
  default-compression:
    model: "gpt-4o"
    temperature: 0.2
    context_window: 128000
    vision: false
  qwen-completion:
    model: "Qwen3-32B"
    temperature: 0.6
    context_window: 131072
    vision: true

container:
  enabled: false
  name: ""
  runtime: ""

tool:
  enable_descriptive_output: true
  max_output_chars: 20000
  web_search_api: ""
  fetch_proxy: ""

browser:
  enabled: false
  listen_addr: "127.0.0.1:8020"
  path: "/browser"

workspace:
  cwd: "./workspace"
  skills_dir: "./.skills"
  crons_dir: "./.cron"
  session_dir: "./.session"

context:
  max_image_bytes: 5242880
  max_output_tokens: 16384
  compression_threshold: 0.7
  compression_tool_result_truncate: 2000
  compression_model: "default-compression"

feishu:
  app_id: ""
  app_secret: ""
  encrypt_key: ""
  verification_token: ""

wechat:
  enabled: false
  bot_token: ""
  base_url: ""

webui:
  enabled: true
  host: "127.0.0.1"
  port: 8017
  token: ""
  assets: "../support/webui/dist"

heartbeat:
  interval_seconds: 1800

sessions:
  "oc_abc123def456":
    model: "qwen-completion"
    compression_model: "default-compression"
